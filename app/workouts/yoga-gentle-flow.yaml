schema_version: 1
name: Gentle yoga flow
description: Standing and floor poses held for five breaths or so.
sport: yoga
tags:
  - yoga
  - mat
steps:
  - type: warmup
    exercise: cur:easy_seat
    seconds: 60
    advance: auto
  - type: repeat
    times: 3
    steps:
      - type: exercise
        exercise: cur:mountain_pose
        seconds: 20
        advance: auto
      - type: exercise
        exercise: yoga:38
        seconds: 30
        advance: auto
      - type: exercise
        exercise: yoga:15
        seconds: 30
        advance: auto
      - type: exercise
        exercise: cur:cobra_pose
        seconds: 20
        advance: auto
  - type: exercise
    exercise: yoga:45
    seconds: 30
    sides: 2
    advance: auto
  - type: exercise
    exercise: yoga:42
    seconds: 30
    sides: 2
    advance: auto
  - type: exercise
    exercise: yoga:41
    seconds: 30
    sides: 2
    advance: auto
  - type: exercise
    exercise: yoga:30
    seconds: 45
    advance: auto
  - type: exercise
    exercise: cur:supine_twist
    seconds: 30
    sides: 2
    advance: auto
  - type: cooldown
    exercise: yoga:11
    advance: manual
    notes: Stay as long as you like, then press Space.
