schema_version: 1
name: Plank ladder
description: Core work built around planks of increasing length.
sport: strength
tags:
  - core
  - planks
  - mat
steps:
  - type: warmup
    exercise: wger:1938
    seconds: 60
    advance: auto
  - type: exercise
    exercise: fedb:Plank
    seconds: 20
    advance: auto
  - type: rest
    seconds: 15
    advance: auto
  - type: exercise
    exercise: fedb:Plank
    seconds: 40
    advance: auto
  - type: rest
    seconds: 15
    advance: auto
  - type: exercise
    exercise: fedb:Plank
    seconds: 60
    advance: manual
    notes: Hold past the beep if you can, then press Space.
  - type: rest
    seconds: 30
    advance: auto
  - type: repeat
    times: 2
    steps:
      - type: exercise
        exercise: wger:580
        seconds: 30
        sides: 2
        advance: auto
      - type: exercise
        exercise: fedb:Dead_Bug
        reps: 10
        advance: manual
      - type: exercise
        exercise: wger:1572
        reps: 8
        sides: 2
        advance: manual
      - type: rest
        seconds: 30
        advance: auto
  - type: cooldown
    exercise: fedb:Childs_Pose
    seconds: 60
    advance: auto
