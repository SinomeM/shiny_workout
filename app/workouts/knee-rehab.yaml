schema_version: 1
name: Knee strengthening
description: >-
  Common knee strengthening exercises with a mat and a resistance band. A general
  example, not medical advice: follow your physiotherapist's prescription.
sport: physio
tags:
  - physio
  - knee
  - band
settings:
  relax_seconds: 3
  switch_seconds: 10
steps:
  - type: warmup
    exercise: cur:physio_heel_slides
    reps: 10
    sides: 2
    advance: manual
  - type: repeat
    times: 2
    skip_last_rest: true
    steps:
      - type: exercise
        exercise: cur:physio_quad_sets
        reps: 10
        hold_seconds: 5
        sides: 2
        advance: auto
        notes: Press the back of the knee into the mat.
      - type: exercise
        exercise: cur:physio_straight_leg_raise
        reps: 10
        hold_seconds: 3
        sides: 2
        advance: auto
      - type: exercise
        exercise: cur:physio_clamshell
        reps: 12
        sides: 2
        advance: manual
        weight: light band
      - type: exercise
        exercise: wger:1408
        seconds: 30
        advance: auto
      - type: rest
        seconds: 60
        advance: auto
  - type: cooldown
    exercise: fedb:Hamstring_Stretch
    seconds: 30
    sides: 2
    advance: auto
