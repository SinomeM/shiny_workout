schema_version: 1
name: Bodyweight strength
description: Full-body circuit, no equipment.
sport: strength
tags:
  - bodyweight
  - full body
steps:
  - type: warmup
    exercise: wger:320
    seconds: 60
    advance: auto
  - type: warmup
    exercise: fedb:Arm_Circles
    seconds: 30
    advance: auto
  - type: repeat
    times: 3
    skip_last_rest: true
    steps:
      - type: exercise
        exercise: fedb:Pushups
        reps: 10
        advance: manual
        notes: Knees down if form breaks.
      - type: exercise
        exercise: fedb:Bodyweight_Squat
        reps: 15
        advance: manual
      - type: exercise
        exercise: wger:999
        reps: 8
        sides: 2
        advance: manual
      - type: exercise
        exercise: wger:265
        reps: 12
        advance: manual
      - type: exercise
        exercise: fedb:Plank
        seconds: 30
        advance: auto
      - type: rest
        seconds: 60
        advance: auto
  - type: cooldown
    name: Stretch
    advance: manual
